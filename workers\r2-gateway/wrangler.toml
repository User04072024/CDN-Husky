name = "huskycdn-r2-gateway"
main = "src/index.mjs"
compatibility_date = "2026-11-17"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cdnhusky"

[[durable_objects.bindings]]
name = "USAGE_COUNTER"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

[vars]
APP_USAGE_URL = "https://cdn.huskydev.space/api/r2/usage-event"
CLASS_B_BASELINE = "16"
CLASS_B_BASELINE_MONTH = "2026-11"
